name: Test Homebrew installation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install and test the Formula
        run: |
          brew tap xlilu/mpv-handler "$GITHUB_WORKSPACE"
          tap=$(brew --repository xlilu/mpv-handler)
          git -C "$tap" fetch "$GITHUB_WORKSPACE" "$GITHUB_SHA"
          git -C "$tap" checkout --detach FETCH_HEAD
          brew install xlilu/mpv-handler/mpv-handler
          brew test xlilu/mpv-handler/mpv-handler

      - name: Verify the generated app and its Terminal integration
        run: |
          app="$RUNNER_TEMP/Applications/mpv-handler.app"
          create-mpv-handler-app --no-register "${app%/*}"
          codesign --verify --deep --strict "$app"
          test -n "$(plutil -extract NSAppleEventsUsageDescription raw -o - "$app/Contents/Info.plist")"
          osadecompile "$app/Contents/Resources/Scripts/main.scpt" | grep -F 'do script '

      - name: Test the regular URL through the app and the debug launcher on a PTY
        shell: bash
        run: |
          app="$RUNNER_TEMP/Applications/mpv-handler.app"

          test_config() {
            local scheme="$1" base="$2" config="$2/mpv-handler"
            local player="$config/mock-mpv"
            mkdir -p "$config/cookies"
            touch "$config/cookies/example.txt"
            printf 'mpv = "%s"\n' "$player" > "$config/config.toml"
            cat > "$player" <<'SH'
          #!/bin/sh
          set -eu
          if [ -t 1 ] && [ -t 2 ]; then
              mode=mpv-handler-debug
          elif [ ! -t 1 ] && [ ! -t 2 ]; then
              mode=mpv-handler
          else
              exit 1
          fi
          folder=${0%/*}
          printf '%s\n' "$mode" "$@" > "$folder/received.tmp"
          mv "$folder/received.tmp" "$folder/received"
          SH
            chmod +x "$player"

            local url="${scheme}://play/aHR0cHM6Ly9leGFtcGxlLm9yZy92aWRlbw/?startat=42&cookies=example.txt"
            if [[ "$scheme" == mpv-handler ]]; then
              /usr/bin/open -n -a "$app" "$url"
            else
              # An actual Terminal do script event requires the user's Automation consent.
              XDG_CONFIG_HOME="$base" /usr/bin/script -q /dev/null "$app/Contents/Resources/open-url" "$url" </dev/null
            fi
            for ((i=0; i<30; i++)); do
              [ -s "$config/received" ] && break
              sleep 1
            done
            printf '%s\n' "$scheme" "--ytdl-raw-options-append=cookies=$config/cookies/example.txt" \
              '--start=42' '--' 'https://example.org/video' > "$config/expected"
            diff -u "$config/expected" "$config/received"
          }

          test_config mpv-handler "$HOME/.config"
          test_config mpv-handler-debug "$RUNNER_TEMP/custom config"
