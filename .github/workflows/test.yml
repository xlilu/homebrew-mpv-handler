name: Test Homebrew installation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install and test the Formula
        run: |
          brew tap xlilu/mpv-handler "$GITHUB_WORKSPACE"
          brew install xlilu/mpv-handler/mpv-handler
          brew test xlilu/mpv-handler/mpv-handler

      - name: Open a protocol URL through the app
        run: |
          apps="$RUNNER_TEMP/Applications"
          create-mpv-handler-app "$apps"

          test_config() {
            local config="$1/mpv-handler"
            shift
            local player="$config/mock-mpv"
            mkdir -p "$config/cookies"
            touch "$config/cookies/example.txt"
            printf 'mpv = "%s"\n' "$player" > "$config/config.toml"
            cat > "$player" <<'SH'
          #!/bin/sh
          set -eu
          out="${0%/*}/received"
          printf '%s\n' "$@" > "$out.tmp"
          mv "$out.tmp" "$out"
          SH
            chmod +x "$player"
            : > "$config/received"

            /usr/bin/open -n "$@" -a "$apps/mpv-handler.app" \
              'mpv-handler://play/aHR0cHM6Ly9leGFtcGxlLm9yZy92aWRlbw/?startat=42&cookies=example.txt'
            for ((i=0; i<30; i++)); do
              [ -s "$config/received" ] && break
              sleep 1
            done
            printf '%s\n' "--ytdl-raw-options-append=cookies=$config/cookies/example.txt" \
              '--start=42' '--' 'https://example.org/video' > "$config/expected"
            diff -u "$config/expected" "$config/received"
          }

          test_config "$HOME/.config"
          custom="$RUNNER_TEMP/custom config"
          test_config "$custom" --env "XDG_CONFIG_HOME=$custom"
